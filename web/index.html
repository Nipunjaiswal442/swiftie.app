<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Matches theme_color/background_color in manifest.webmanifest — keep the three in sync. -->
    <meta name="theme-color" content="#0a0a12" />
    <title>SWIFTIE — Connect. Chat. Encrypt.</title>
    <meta name="description" content="India's next-gen social platform with military-grade end-to-end encryption." />

    <!-- ── Installable web app ─────────────────────────────────────────────
         sw.js and manifest.webmanifest live in public/, which Vite copies to
         the deploy root, so the worker's scope covers the whole site. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />

    <!-- iOS ignores the manifest icons and its display mode entirely; without
         these it opens the app in Safari chrome rather than standalone.
         180x180 is Apple's documented touch-icon size — at any other size iOS
         may rescale it or fall back to a screenshot of the page. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- black-translucent runs the page under the status bar, so every fixed
         edge in theme.css steps around env(safe-area-inset-*). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Swiftie" />

    <!-- Launch images. iOS uses none of the manifest's icons or background_color
         for the splash, so without an exact media match it shows a blank screen. -->
    <link rel="apple-touch-startup-image" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/apple-splash-640-1136.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/apple-splash-750-1334.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/apple-splash-1242-2208.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/apple-splash-1125-2436.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/apple-splash-828-1792.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/apple-splash-1242-2688.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/apple-splash-1170-2532.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/apple-splash-1284-2778.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/apple-splash-1179-2556.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/apple-splash-1290-2796.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/apple-splash-1206-2622.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/apple-splash-1320-2868.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved appearance (palette / text size / font / motion) before
      // the first paint so there is no flash of the default theme. Mirrors
      // src/appearance.ts — keep the two in sync.
      (function () {
        try {
          var raw = localStorage.getItem('swiftie.appearance');
          var a = raw ? JSON.parse(raw) : {};
          var root = document.documentElement;
          var palettes = ['tricolour', 'cyan', 'magenta', 'amber', 'mono', 'light'];
          var scales = ['small', 'medium', 'large', 'xlarge'];
          var fonts = ['cyber', 'readable', 'mono'];
          root.setAttribute('data-palette', palettes.indexOf(a.palette) >= 0 ? a.palette : 'tricolour');
          root.setAttribute('data-font-scale', scales.indexOf(a.fontScale) >= 0 ? a.fontScale : 'medium');
          root.setAttribute('data-font', fonts.indexOf(a.fontFamily) >= 0 ? a.fontFamily : 'cyber');
          root.setAttribute('data-motion', a.reduceMotion === true ? 'reduced' : 'full');
        } catch (e) { /* ignore */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
